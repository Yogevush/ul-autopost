name: post

on:
  schedule:
    # מתעורר פעמיים ביום, ב-17:00 וב-18:00 UTC.
    # הסקריפט מפרסם רק אם השעה בישראל היא 20:00, ולכן
    # המעבר בין שעון קיץ לחורף מטופל לבד. אין מה לתקן.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'לפרסם עכשיו בלי בדיקת שעה ובלי בדיקת יום'
        type: boolean
        default: true
      force_type:
        description: 'מה לפרסם'
        type: choice
        options: ['image', 'reel']
        default: 'image'

permissions:
  contents: write
  issues: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: publish
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          FORCE: ${{ inputs.force }}
          FORCE_TYPE: ${{ inputs.force && inputs.force_type || '' }}
        run: python publish.py

      - name: commit state
        if: always()
        run: |
          git config user.name  "unique-lectures-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git push || true
