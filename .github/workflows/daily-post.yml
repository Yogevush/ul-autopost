name: post

on:
  schedule:
    # גיטהאב מאחר בהפעלת משימות מתוזמנות, לפעמים בשעות, ובמיוחד בתחילת שעה עגולה.
    # לכן מתעוררים כמה פעמים, בדקות לא עגולות, לאורך הערב (שעון גריניץ').
    # הסקריפט מפרסם רק בתוך חלון הפרסום בישראל (20:00 עד 23:59) ורק פעם ביום,
    # ולכן המעבר בין שעון קיץ לחורף מטופל לבד. אין מה לתקן.
    - cron: '7 17 * * *'
    - cron: '37 17 * * *'
    - cron: '7 18 * * *'
    - cron: '37 18 * * *'
    - cron: '7 19 * * *'
    - cron: '37 19 * * *'
    - cron: '7 20 * * *'
    - cron: '37 20 * * *'
    - cron: '7 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'לפרסם עכשיו בלי בדיקת שעה ובלי בדיקת יום'
        type: boolean
        default: true
      force_type:
        description: 'מה לפרסם'
        type: choice
        options: ['post', 'reel', 'carousel', 'image']
        default: 'post'

permissions:
  contents: write
  issues: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: publish
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          FORCE: ${{ inputs.force }}
          FORCE_TYPE: ${{ inputs.force && inputs.force_type || '' }}
        run: python publish.py

      - name: commit state
        if: always()
        run: |
          git config user.name  "unique-lectures-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state/
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%F)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || true
          fi
